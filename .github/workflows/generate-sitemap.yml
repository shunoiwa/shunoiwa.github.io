name: Generate sitemap

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.html"
      - "scripts/generate-sitemap.ps1"
      - ".github/workflows/generate-sitemap.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sitemap
        shell: pwsh
        run: ./scripts/generate-sitemap.ps1 -BaseUrl "https://shunoiwa.github.io"

      - name: Commit sitemap
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap"
          git push
