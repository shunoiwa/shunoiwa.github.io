<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>記事テンプレート - Gnuplot備忘録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="container">
  <aside class="sidebar">
    <h1>ナビゲーション</h1>
    <ul class="nav">
      <li><a href="../index.html">ホーム</a></li>
      <li><a href="../res.html">研究</a></li>
      <li><a href="gnu.html">Gnuplot備忘録</a><ul class="subnav" id="gnu-nav"></ul></li>
    </ul>
  </aside>

  <main class="main">
    <h1>A-B. タイトル</h1>
    <p>導入文を書く場所です。</p>
    <hr>

    <h2>見出し</h2>
    <p>本文を書く場所です。</p>
    <pre><code>plot xxx, \
     yyy</code></pre>

    <div class="point-box">
      <p>要点を書く場所です。</p>
    </div>
  </main>
</div>
<script>
const currentPage = location.pathname.split("/").pop();
fetch("gnu_list.json").then(res => res.json()).then(data => {
  const nav = document.getElementById("gnu-nav");
  data.forEach(chapter => {
    const li = document.createElement("li");
    const title = document.createElement("div");
    title.textContent = "第" + chapter.chapter + "章: " + chapter.title;
    title.style.fontWeight = "bold";
    title.style.marginTop = "10px";
    li.appendChild(title);
    const ul = document.createElement("ul");
    ul.classList.add("subnav");
    chapter.pages.forEach(page => {
      if (!page.file) return;
      const subLi = document.createElement("li");
      const a = document.createElement("a");
      const num = page.file.match(/(\d+-\d+)/)?.[1] ?? "";
      a.href = page.file;
      a.textContent = num + ". " + page.title;
      if (page.file === currentPage) a.classList.add("active");
      subLi.appendChild(a);
      ul.appendChild(subLi);
    });
    li.appendChild(ul);
    nav.appendChild(li);
  });
});
</script>
</body>
</html>
