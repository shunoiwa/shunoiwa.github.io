<style>
:root {
    color-scheme: light;
    --bg: #f6f8fb;
    --ink: #182133;
    --muted: #667085;
    --line: #d9e2ef;
    --panel: #ffffff;
    --blue: #2458d3;
    --blue-dark: #173f9a;
    --blue-soft: #eff6ff;
    --green: #0f766e;
    --gold: #b7791f;
    --shadow: 0 18px 44px rgba(24, 33, 51, 0.12);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Noto Sans JP", "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
    font-weight: 400;
    color: var(--ink);
    background:
        linear-gradient(180deg, rgba(231, 238, 249, 0.96), rgba(246, 248, 251, 0.6) 420px),
        var(--bg);
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
}

a {
    color: inherit;
}

.site-header {
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid rgba(217, 226, 239, 0.9);
    background: rgba(246, 248, 251, 0.86);
    backdrop-filter: blur(14px);
}

.nav-wrap {
    width: min(1180px, calc(100% - 32px));
    min-height: 72px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 22px;
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    font-weight: 650;
}

.brand-actions {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: block;
    object-fit: cover;
    border: 1px solid rgba(23, 32, 51, 0.12);
}

.share-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    padding: 7px 12px;
    border-radius: 7px;
    background: #111827;
    color: #fff;
    font-size: 0.84rem;
    font-weight: 650;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 8px 20px rgba(17, 24, 39, 0.18);
}

.share-button:hover,
.share-button:focus-visible {
    background: #2458d3;
}

.nav-links {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    flex-wrap: wrap;
}

.nav-links a {
    padding: 8px 10px;
    border-radius: 7px;
    color: #334155;
    font-size: 0.92rem;
    text-decoration: none;
}

.nav-links a:hover,
.nav-links a.is-current {
    background: #e8eef8;
    color: var(--blue-dark);
}

.page-shell {
    width: min(1180px, calc(100% - 32px));
    margin: 0 auto;
    padding: 44px 0 64px;
}

.topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding: 42px 0 24px;
    margin-bottom: 12px;
}

.eyebrow {
    margin: 0 0 10px;
    color: var(--blue-dark);
    font-size: 0.78rem;
    font-weight: 650;
    letter-spacing: 0;
    text-transform: uppercase;
}

h1 {
    margin: 0;
    max-width: 780px;
    font-size: clamp(2rem, 5.5vw, 4.6rem);
    font-weight: 520;
    line-height: 0.98;
    letter-spacing: 0;
}

.subtitle {
    margin: 18px 0 0;
    max-width: 680px;
    color: #475467;
    font-size: 1.08rem;
    line-height: 1.9;
}

.language-switch {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    background: #e2e8f0;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
}

.language-switch button {
    min-width: 48px;
    padding: 8px 12px;
    border-radius: 6px;
    background: transparent;
    color: #334155;
    font-weight: 600;
    cursor: pointer;
}

.language-switch button.is-active {
    background: var(--panel);
    color: var(--blue-dark);
    box-shadow: 0 2px 9px rgba(15, 23, 42, 0.12);
}

#filter-area {
    display: flex;
    flex-direction: column;
    gap: 15px;
    justify-content: center;
    background: var(--blue-soft);
    border: 1px solid #bfdbfe;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    margin-bottom: 24px;
}

.filter-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.instrument-filter-panel {
    flex: 1;
    min-width: min(100%, 320px);
    border: 1px solid #93c5fd;
    border-radius: 8px;
    background: #fff;
}

.instrument-filter-summary {
    cursor: pointer;
    list-style: none;
    padding: 10px 12px;
    color: var(--blue-dark);
    font-weight: 600;
}

.instrument-filter-summary::-webkit-details-marker {
    display: none;
}

.instrument-filter-summary::before {
    content: "+";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    margin-right: 7px;
    border-radius: 999px;
    background: #dbeafe;
    color: var(--blue-dark);
    font-size: 0.78rem;
}

.instrument-filter-panel[open] > .instrument-filter-summary::before {
    content: "-";
}

.selected-instruments {
    margin-left: 10px;
    color: #475569;
    font-size: 0.86rem;
    font-weight: 500;
    line-height: 1.5;
}

#instrument-controls {
    display: flex;
    gap: 10px;
    margin: 0 10px 10px;
    flex-wrap: wrap;
}

#instrument-boxes {
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: visible;
    background: #fff;
    padding: 10px;
    border-top: 1px solid #bfdbfe;
}

.instrument-group {
    min-width: 0;
    padding: 10px;
    border: 1px solid #d8e1ee;
    border-radius: 8px;
    background: #f8fafc;
}

.instrument-group[open] {
    background: #fff;
}

.instrument-group-title {
    margin: 0;
    cursor: pointer;
    list-style: none;
    color: var(--blue-dark);
    font-size: 0.82rem;
    font-weight: 600;
}

.instrument-group-title::-webkit-details-marker {
    display: none;
}

.instrument-group-title::before {
    content: "+";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    margin-right: 7px;
    border-radius: 999px;
    background: #dbeafe;
    color: var(--blue-dark);
    font-size: 0.78rem;
}

.instrument-group[open] > .instrument-group-title::before {
    content: "-";
}

.instrument-group-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 9px;
}

.instrument-subgroups {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 9px;
    padding-left: 18px;
    border-left: 2px solid #dbeafe;
}

label {
    font-weight: 600;
    color: var(--blue-dark);
}

.checkbox-label,
.radio-label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 500;
    color: #1f2937;
}

input[type="text"],
select {
    padding: 7px 10px;
    border: 1px solid #93c5fd;
    border-radius: 6px;
    outline: none;
    background: #fff;
}

input[type="text"] {
    min-width: min(280px, 100%);
}

input[type="checkbox"] {
    transform: scale(1.1);
}

input:focus,
select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 4px rgba(37,99,235,0.3);
}

.filter-button {
    background: #3b82f6;
    color: white;
    border-radius: 6px;
    padding: 6px 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

.filter-button:hover {
    background: var(--blue);
}

.mode-label {
    margin-left: 10px;
    font-weight: 600;
    color: var(--blue-dark);
}

.result-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin: 0 0 18px;
    color: var(--muted);
    font-weight: 500;
}

.section {
    margin-top: 28px;
}

.section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
}

.section-title {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 500;
    letter-spacing: 0;
}

.section-count {
    color: var(--muted);
    font-weight: 500;
}

.song-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
}

.song-item {
    min-width: 0;
}

.detail-row {
    grid-column: 1 / -1;
    min-width: 0;
}

.summary-card {
    width: 100%;
    min-height: 104px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    text-align: left;
    padding: 18px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: 0 6px 20px rgba(30, 41, 59, 0.07);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    animation: cardIn 0.28s ease both;
}

.summary-card:hover,
.summary-card:focus-visible {
    border-color: #93c5fd;
    box-shadow: var(--shadow);
    transform: translateY(-2px);
    outline: none;
}

.summary-card.is-active {
    border-color: #60a5fa;
    background: #f8fbff;
    box-shadow: 0 10px 26px rgba(37, 99, 235, 0.13);
}

.summary-title {
    display: block;
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.45;
}

.summary-id {
    display: block;
    margin-top: 7px;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 500;
}

.summary-mark {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    background: #f1f5f9;
    color: var(--blue-dark);
    font-size: 1.35rem;
    font-weight: 500;
    transition: transform 0.18s ease, background 0.18s ease;
}

.summary-card.is-active .summary-mark {
    background: #dbeafe;
    transform: rotate(45deg);
}

.detail-card {
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #fff;
    box-shadow: var(--shadow);
    animation: detailIn 0.26s ease both;
}

.detail-card[hidden],
.section[hidden],
#no-results[hidden] {
    display: none;
}

.detail-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
}

.detail-title {
    margin: 0;
    font-size: 1.22rem;
    font-weight: 500;
    line-height: 1.35;
}

.close-detail {
    flex: 0 0 auto;
    min-width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #e2e8f0;
    color: #0f172a;
    font-size: 1.15rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.18s ease;
}

.close-detail:hover {
    background: #cbd5e1;
    transform: translateY(-1px);
}

.detail-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
}

.info-block {
    min-width: 0;
    padding: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
}

.info-block.is-wide {
    grid-column: span 2;
}

.info-block.is-full {
    grid-column: 1 / -1;
}

.info-label {
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.info-value {
    margin: 0;
    font-weight: 500;
    overflow-wrap: anywhere;
}

.help-tip {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--blue-dark);
    text-transform: none;
}

.help-icon {
    width: 17px;
    height: 17px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #93c5fd;
    border-radius: 999px;
    background: #eff6ff;
    color: var(--blue-dark);
    font-size: 0.68rem;
    font-weight: 700;
    line-height: 1;
    cursor: help;
}

.help-bubble {
    position: absolute;
    left: 50%;
    top: calc(100% + 8px);
    z-index: 30;
    width: max-content;
    max-width: min(320px, calc(100vw - 40px));
    padding: 10px 12px;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    background: rgba(15, 23, 42, 0.5);
    color: #f8fafc;
    box-shadow: 0 16px 34px rgba(15, 23, 42, 0.22);
    font-size: 0.78rem;
    font-weight: 500;
    line-height: 1.55;
    letter-spacing: 0;
    text-transform: none;
    white-space: pre-line;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, -3px);
    transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s ease;
}

.help-tip:hover .help-bubble,
.help-tip:focus-visible .help-bubble {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
}

.link-warning-tip {
    position: relative;
    display: inline-flex;
}

.link-warning-bubble {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 8px);
    z-index: 30;
    width: max-content;
    max-width: min(320px, calc(100vw - 40px));
    padding: 10px 12px;
    border: 1px solid #fecaca;
    border-radius: 8px;
    background: rgba(127, 29, 29, 0.5);
    color: #fff;
    box-shadow: 0 16px 34px rgba(127, 29, 29, 0.2);
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1.55;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 3px);
    transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s ease;
}

.link-warning-tip:hover .link-warning-bubble,
.link-warning-tip:focus-within .link-warning-bubble {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
}

.comment-text {
    white-space: pre-line;
}

.map-block.is-pending {
    display: none;
}

.map-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    padding: 10px;
    border: 1px solid #d8e1ee;
    border-radius: 8px;
    background: #fff;
}

.map-image {
    display: block;
    max-width: none;
    height: auto;
}

.party-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px;
    margin: 0;
}

.party-part {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 9px 10px;
    border-radius: 6px;
    background: #fff;
    border: 1px solid #e2e8f0;
}

.part-number {
    color: var(--green);
    font-weight: 600;
}

.party-name {
    min-width: 0;
}

.party-name.is-alternative {
    color: var(--blue);
    font-weight: 650;
}

.alt-part-button {
    justify-self: end;
    border: 1px solid #bfdbfe;
    border-radius: 999px;
    background: #eff6ff;
    color: var(--blue-dark);
    font-size: 0.74rem;
    font-weight: 700;
    line-height: 1;
    padding: 5px 8px;
    cursor: pointer;
}

.alt-part-button:hover,
.alt-part-button:focus-visible {
    border-color: #93b4ee;
    background: #dbeafe;
}

.alt-part-button.is-active {
    border-color: var(--blue);
    background: var(--blue);
    color: #fff;
}

.alt-part-button.is-active:hover,
.alt-part-button.is-active:focus-visible {
    border-color: var(--blue-dark);
    background: var(--blue-dark);
}

.link-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.sell-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 104px;
    min-height: 38px;
    padding: 8px 13px;
    border-radius: 7px;
    text-decoration: none;
    font-weight: 600;
    border: 1px solid transparent;
    transition: transform 0.18s ease, filter 0.18s ease;
}

.sell-button:not(.is-disabled):hover {
    transform: translateY(-1px);
    filter: brightness(1.04);
}

.sell-button.youtube {
    background: #ff2b2b;
    color: #111827;
}

.sell-button.instagram {
    background: #d62976;
    color: #fff;
}

.sell-button.booth {
    background: #ef4444;
    color: #fff;
}

.sell-button.is-disabled {
    background: #cbd5e1;
    color: #64748b;
    cursor: not-allowed;
    pointer-events: none;
}

#no-results {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    color: #b91c1c;
    background: #fff1f2;
    border: 1px solid #fecdd3;
    border-radius: 8px;
    padding: 22px;
    margin-top: 22px;
}

.loading,
.error-message {
    padding: 28px;
    border-radius: 8px;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--muted);
    font-weight: 600;
    text-align: center;
}

.error-message {
    color: #b91c1c;
    background: #fff1f2;
    border-color: #fecdd3;
}

.notice-message {
    padding: 14px 16px;
    border-radius: 8px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    font-weight: 600;
    margin-bottom: 18px;
}

.footer {
    border-top: 1px solid var(--line);
    background: #eef3fa;
}

.footer-inner {
    width: min(1180px, calc(100% - 32px));
    margin: 0 auto;
    padding: 26px 0;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    color: #475467;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes detailIn {
    from {
        opacity: 0;
        transform: translateY(-8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}

@media (max-width: 780px) {
    .nav-wrap {
        min-height: auto;
        padding: 14px 0;
        align-items: flex-start;
        flex-direction: column;
    }

    .brand-actions {
        width: 100%;
        padding-right: 118px;
    }

    .share-button {
        position: absolute;
        top: 12px;
        right: 16px;
        z-index: 30;
        min-height: 36px;
        box-shadow: 0 10px 24px rgba(17, 24, 39, 0.22);
    }

    .nav-links {
        justify-content: flex-start;
    }

    .page-shell {
        width: min(100% - 22px, 1180px);
        padding-top: 22px;
    }

    .topbar,
    .result-meta,
    .section-header,
    .detail-head {
        align-items: stretch;
        flex-direction: column;
    }

    .language-switch {
        align-self: flex-start;
    }

    .filter-row {
        align-items: stretch;
        flex-direction: column;
    }

    #instrument-controls {
        align-items: flex-start;
        flex-direction: column;
    }

    .mode-label {
        margin-left: 0;
    }

const ensembleNamesEn = {
    1: "Solo",
    2: "Duo",
    3: "Trio",
    4: "Quartet",
    5: "Quintet",
    6: "Sextet",
    7: "Septet",
    8: "Octet",
    9: "Nonet",
    10: "Decet"
};

const state = {
    lang: "ja",
    songs: [],
    formNames: { ja: {}, en: {} },
    instrumentGroups: {},
    instrumentCategoryByName: {},
    descriptions: {},
    openId: null
};

document.addEventListener("DOMContentLoaded", init);

async function init() {
    bindControls();
    updateStaticText();

    try {
        const [songs, hyp, inst, descriptions, usedFallback] = await loadData();
        const formData = hyp.find(item => item.kind === "form") || {};
        const instrumentGroups = normalizeInstrumentGroups(inst);
        state.songs = songs;
        state.formNames = {
            ja: formData.ja || {},
            en: formData.en || {}
        };
        state.instrumentGroups = instrumentGroups;
        state.instrumentCategoryByName = buildInstrumentCategoryMap(instrumentGroups);
        state.descriptions = buildDescriptionMap(descriptions);
        buildInstrumentCheckboxes();
        document.getElementById("loading").hidden = true;
        if (usedFallback) {
            showNotice(t("localFallback"));
        }
        filterTable();
    } catch (error) {
        console.error(error);
        document.getElementById("loading").hidden = true;
        const errorBox = document.getElementById("error-message");
        errorBox.textContent = t("loadError");
        errorBox.hidden = false;
    }
}

async function loadData() {
    try {
        const [songs, hyp, inst, descriptions] = await Promise.all([
            fetchJson("songdatas.json"),
            fetchJson("hyp.json"),
            fetchJson("inst.json"),
            fetchJson("../description.json").catch(() => parseFallbackJson("description-fallback"))
        ]);
        return [songs, hyp, inst, descriptions, false];
    } catch (error) {
        const songs = parseFallbackJson("songdatas-fallback");
        const hyp = parseFallbackJson("hyp-fallback");
        const inst = parseFallbackJson("inst-fallback");
        const descriptions = parseFallbackJson("description-fallback");
        if (songs.length && hyp.length) {
            return [songs, hyp, inst, descriptions, true];
        }
        throw error;
    }
}

async function fetchJson(path) {
    const response = await fetch(path, { cache: "no-store" });
    if (!response.ok) {
        throw new Error(`${path}: ${response.status}`);
    }
    return response.json();
}

function parseFallbackJson(id) {
    const node = document.getElementById(id);
    if (!node) {
        return [];
    }
    return JSON.parse(node.textContent || "[]");
}

function buildDescriptionMap(items) {
    return (items || []).reduce((map, item) => {
        if (item?.content) {
            map[item.content] = item;
        }
        return map;
    }, {});
}

function normalizeInstrumentGroups(data) {
    if (Array.isArray(data)) {
        return data[0] || {};
    }
    return data || {};
}

function buildInstrumentCategoryMap(groups) {
    const map = {};
    Object.entries(groups || {}).forEach(([categoryKey, category]) => {
        collectInstrumentEntries(categoryKey, category, []).forEach(entry => {
            map[entry.instrument] = {
                key: entry.key,
                name: entry.name,
                canname: entry.canname,
                path: entry.path,
                instrumentName: entry.instrument,
                instrumentNameJa: entry.instrumentNameJa
            };
        });
    });
    return map;
}

function collectInstrumentEntries(key, node, parentPath) {
    const current = {
        key,
        name: node.name || key,
        canname: node.canname !== false
    };
    const path = parentPath.concat(current);
    const entries = [];

    Object.entries(node.insts || {}).forEach(([instrument, instrumentNameJa]) => {
        entries.push({
            key,
            name: current.name,
            canname: current.canname,
            path,
            instrument,
            instrumentNameJa: instrumentNameJa || instrument
        });
    });

    Object.entries(node.groups || {}).forEach(([childKey, child]) => {
        entries.push(...collectInstrumentEntries(childKey, child, path));
    });

    return entries;
}

function showNotice(message) {
    const notice = document.getElementById("notice-message");
    notice.textContent = message;
    notice.hidden = false;
}

function bindControls() {
    document.querySelectorAll("[data-lang]").forEach(button => {
        button.addEventListener("click", () => {
            state.lang = button.dataset.lang;
            document.documentElement.lang = state.lang;
            document.querySelectorAll("[data-lang]").forEach(btn => {
                btn.classList.toggle("is-active", btn.dataset.lang === state.lang);
            });
            updateStaticText();
            filterTable();
        });
    });

    document.getElementById("select-all").addEventListener("click", () => {
        document.querySelectorAll("#instrument-boxes input").forEach(cb => cb.checked = true);
        filterTable();
    });

    document.getElementById("clear-all").addEventListener("click", () => {
        document.querySelectorAll("#instrument-boxes input").forEach(cb => cb.checked = false);
        filterTable();
    });

    document.querySelectorAll('input[name="logic-mode"]').forEach(radio => {
        radio.addEventListener("change", filterTable);
    });

    document.getElementById("filter-title").addEventListener("input", filterTable);
    document.getElementById("filter-id").addEventListener("input", filterTable);
    document.getElementById("filter-difficulty-min").addEventListener("change", filterTable);
    document.getElementById("filter-difficulty-max").addEventListener("change", filterTable);
    document.getElementById("filter-size").addEventListener("change", filterTable);
    document.getElementById("filter-duration").addEventListener("change", filterTable);
    document.getElementById("filter-sale-status").addEventListener("change", filterTable);
}

function buildInstrumentCheckboxes() {
    const box = document.getElementById("instrument-boxes");
    box.textContent = "";

    Object.entries(state.instrumentGroups).forEach(([categoryKey, category]) => {
        box.appendChild(createInstrumentGroup(categoryKey, category));
    });
}

function createInstrumentGroup(groupKey, groupData, open = false) {
    const group = document.createElement("details");
    group.className = "instrument-group";
    group.open = open;

    const title = document.createElement("summary");
    title.className = "instrument-group-title";
    title.textContent = groupData.name || groupKey;
    group.appendChild(title);

    const instruments = Object.keys(groupData.insts || {});
    if (instruments.length) {
        const list = document.createElement("div");
        list.className = "instrument-group-list";

        instruments.forEach(inst => {
            list.appendChild(createInstrumentCheckbox(inst));
        });

        group.appendChild(list);
    }

    const subgroups = Object.entries(groupData.groups || {});
    if (subgroups.length) {
        const container = document.createElement("div");
        container.className = "instrument-subgroups";
        subgroups.forEach(([childKey, child]) => {
            container.appendChild(createInstrumentGroup(childKey, child));
        });
        group.appendChild(container);
    }

    return group;
}

function createInstrumentCheckbox(inst) {
    const label = document.createElement("label");
    label.className = "checkbox-label";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = inst;
    cb.addEventListener("change", filterTable);
    label.appendChild(cb);
    label.appendChild(document.createTextNode(inst));
    return label;
}

function updateStaticText() {
    document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = t(node.dataset.i18n);
    });
    document.getElementById("filter-title").placeholder = t("titlePlaceholder");
    document.getElementById("filter-id").placeholder = t("idPlaceholder");
    updateDifficultyOptions();
    updateSizeOptions();
    updateSelectedInstrumentsText();
}

function updateDifficultyOptions() {
    updateDifficultySelect("filter-difficulty-min", t("difficultyMinAny"));
    updateDifficultySelect("filter-difficulty-max", t("difficultyMaxAny"));
}

function updateDifficultySelect(id, emptyLabel) {
    const select = document.getElementById(id);
    const selected = select.value;
    select.textContent = "";

    const emptyOption = document.createElement("option");
    emptyOption.value = "";
    emptyOption.textContent = emptyLabel;
    select.appendChild(emptyOption);

    for (let level = 1; level <= 7; level += 1) {
        const letter = difficultyLetter(level);
        const option = document.createElement("option");
        option.value = String(level);
        option.textContent = `${letter} (Grade ${level}相当)`;
        select.appendChild(option);
    }

    select.value = selected;
}

function updateSizeOptions() {
    const select = document.getElementById("filter-size");
    const selected = select.value;
    select.textContent = "";

    const allOption = document.createElement("option");
    allOption.value = "";
    allOption.textContent = t("allSizes");
    select.appendChild(allOption);

    for (let count = 1; count <= 10; count += 1) {
        const option = document.createElement("option");
        option.value = String(count);
        option.textContent = state.lang === "ja" ? String(count) : ensembleNamesEn[count];
        select.appendChild(option);
    }

    select.value = selected;
}

function filterTable() {
    const title = document.getElementById("filter-title").value.trim().toLowerCase();
    const idQuery = document.getElementById("filter-id").value.trim().toUpperCase();
    const diffMin = Number(document.getElementById("filter-difficulty-min").value) || 1;
    const diffMax = Number(document.getElementById("filter-difficulty-max").value) || 7;
    const size = document.getElementById("filter-size").value;
    const durationRange = document.getElementById("filter-duration").value;
    const saleStatus = document.getElementById("filter-sale-status").value;
    const checked = [...document.querySelectorAll("#instrument-boxes input:checked")].map(c => c.value);
    const mode = document.querySelector('input[name="logic-mode"]:checked').value;

    const filtered = state.songs.filter(song => {
        const titlePool = [
            song.title?.ja || "",
            song.title?.en || "",
            formatHeading(song, "ja"),
            formatHeading(song, "en")
        ].join(" ").toLowerCase();
        const form = (song.party || []).flatMap(part => instrumentNamesFromPart(part)).join(" ");
        const level = difficultyLetter(song.difficulty);
        const songId = formatSongId(song).toUpperCase();
        const difficulty = Number(song.difficulty) || 0;

        let show = true;
        if (title && !titlePool.includes(title)) show = false;
        if (idQuery && !songId.includes(idQuery)) show = false;
        if (difficulty < Math.min(diffMin, diffMax) || difficulty > Math.max(diffMin, diffMax)) show = false;
        if (size && effectivePartyCount(song) !== Number(size)) show = false;
        if (durationRange && !matchesDurationRange(song.duration, durationRange)) show = false;
        if (saleStatus === "on-sale" && !isOnSale(song)) show = false;
        if (saleStatus === "not-on-sale" && isOnSale(song)) show = false;

        if (checked.length > 0) {
            if (mode === "OR") {
                const match = checked.some(inst => form.includes(inst));
                if (!match) show = false;
            } else if (mode === "AND") {
                const matchAll = checked.every(inst => form.includes(inst));
                if (!matchAll) show = false;
            } else if (mode === "EXCLUDE") {
                const hasExcluded = checked.some(inst => form.includes(inst));
                if (hasExcluded) show = false;
            }
        }

        return show;
    });

    updateSelectedInstrumentsText(checked);
    renderSections(filtered, checked.length);
}

function updateSelectedInstrumentsText(checked = null) {
    const selected = checked || [...document.querySelectorAll("#instrument-boxes input:checked")].map(c => c.value);
    const box = document.getElementById("selected-instruments");
    if (!box) {
        return;
    }
    box.textContent = selected.length ? t("selectedInstruments", selected) : t("selectedInstrumentsNone");
}

function isOnSale(song) {
    const price = song.sells?.price;
    return price !== null && price !== undefined && price !== "";
}

function matchesDurationRange(seconds, range) {
    const duration = Number(seconds) || 0;
    if (range === "short") {
        return duration <= 180;
    }
    if (range === "normal") {
        return duration > 180 && duration < 360;
    }
    if (range === "long") {
        return duration >= 360;
    }
    return true;
}

function renderSections(filtered, checkedCount) {
    const solo = sortSongsById(filtered.filter(song => effectivePartyCount(song) <= 2));
    const ensemble = sortSongsById(filtered.filter(song => effectivePartyCount(song) > 2));

    document.getElementById("result-count").textContent = t("pieceCount", filtered.length);
    document.getElementById("active-filters").textContent = t("activeFilters", checkedCount);
    document.getElementById("solo-count").textContent = t("pieceCount", solo.length);
    document.getElementById("ensemble-count").textContent = t("pieceCount", ensemble.length);

    renderSongList(document.getElementById("solo-list"), solo);
    renderSongList(document.getElementById("ensemble-list"), ensemble);

    document.getElementById("solo-section").hidden = solo.length === 0;
    document.getElementById("ensemble-section").hidden = ensemble.length === 0;
    document.getElementById("no-results").hidden = filtered.length !== 0;
}

function sortSongsById(songs) {
    return [...songs].sort((a, b) => formatSongId(a).localeCompare(formatSongId(b), "en", { numeric: true }));
}

function renderSongList(container, songs) {
    container.textContent = "";
    const fragment = document.createDocumentFragment();
    songs.forEach(song => {
        fragment.appendChild(createSongItem(song));
        if (state.openId === formatSongId(song)) {
            const detailRow = document.createElement("div");
            detailRow.className = "detail-row";
            detailRow.appendChild(createDetailCard(song));
            fragment.appendChild(detailRow);
        }
    });
    container.appendChild(fragment);
}

function createSongItem(song) {
    const id = formatSongId(song);
    const item = document.createElement("article");
    item.className = "song-item";
    item.dataset.songId = id;

    const summary = document.createElement("button");
    summary.type = "button";
    summary.className = "summary-card";
    summary.classList.toggle("is-active", state.openId === id);
    summary.setAttribute("aria-expanded", state.openId === id ? "true" : "false");
    summary.innerHTML = `
        <span>
            <span class="summary-title">${escapeHtml(formatHeading(song))}</span>
            <span class="summary-id">${escapeHtml(id)} / ${escapeHtml(formatDuration(song.duration))} / ${escapeHtml(difficultyLetter(song.difficulty))}</span>
        </span>
        <span class="summary-mark" aria-hidden="true">+</span>
    `;
    summary.addEventListener("click", () => {
        state.openId = state.openId === id ? null : id;
        filterTable();
    });

    item.appendChild(summary);
    return item;
}

function createDetailCard(song) {
    const id = formatSongId(song);
    const card = document.createElement("div");
    card.className = "detail-card";

    const heading = formatHeading(song);
    const title = escapeHtml(heading);
    card.innerHTML = `
        <div class="detail-head">
            <h3 class="detail-title">${title}</h3>
            <button type="button" class="close-detail" aria-label="${escapeHtml(t("close"))}">×</button>
        </div>
        <div class="detail-grid">
            ${infoBlock(t("id"), id, "", "musicid")}
            ${infoBlock(t("duration"), formatDuration(song.duration), "", "duration")}
            ${infoBlock(t("difficulty"), difficultyLetter(song.difficulty), "", "difficulty", difficultyLetter(song.difficulty))}
            ${infoBlock(t("price"), formatPrice(song.sells?.price), "", "price")}
            ${infoBlock(t("formTitle"), formatHeading(song), "is-wide", "partytitle")}
            ${linksBlock(song.sells || {}, isHighDifficulty(song))}
            ${partyBlock(song.party || [])}
            ${mapBlock(id, heading)}
            ${commentBlock(song.comment)}
        </div>
    `;

    initMapBlock(card);
    initAlternativePartToggles(card);

    card.querySelector(".close-detail").addEventListener("click", () => {
        if (state.openId === id) {
            state.openId = null;
        }
        filterTable();
    });

    return card;
}

function infoBlock(label, value, extraClass = "", descriptionKey = "", descriptionSubKey = "") {
    return `
        <div class="info-block ${extraClass}">
            ${labelWithHelp(label, descriptionKey, descriptionSubKey)}
            <p class="info-value">${escapeHtml(value)}</p>
        </div>
    `;
}

function linksBlock(sells, showDifficultyWarning = false) {
    return `
        <div class="info-block is-wide">
            ${labelWithHelp(t("links"), "links")}
            <div class="link-row">
                ${linkButton("Youtube", sells.youtube, "youtube", showDifficultyWarning)}
                ${linkButton("Instagram", sells.instagram, "instagram", showDifficultyWarning)}
                ${linkButton("Booth", sells.booth, "booth", showDifficultyWarning)}
            </div>
        </div>
    `;
}

function linkButton(label, url, type, showDifficultyWarning = false) {
    const button = url
        ? `<a class="sell-button ${type}" href="${escapeAttribute(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`
        : `<span class="sell-button ${type} is-disabled" aria-disabled="true">${escapeHtml(label)}</span>`;

    if (!showDifficultyWarning) {
        return button;
    }

    return `
        <span class="link-warning-tip">
            ${button}
            <span class="link-warning-bubble" role="tooltip">${escapeHtml(t("highDifficultyWarning"))}</span>
        </span>
    `;
}

function isHighDifficulty(song) {
    return Number(song.difficulty) >= 6;
}

function partyBlock(party) {
    const items = party.map((part, index) => {
        const isAccompaniment = isAccompanimentPart(part);
        const partNumber = isAccompaniment ? "a" : index + 1;
        const partName = displayPartName(part);
        const hasAlternative = isAlternativePart(part);
        const altName = hasAlternative ? displayPartName(part, true) : "";
        const nameAttributes = hasAlternative
            ? ` data-main-part="${escapeAttribute(partName)}" data-alt-part="${escapeAttribute(altName)}"`
            : "";
        const alternativeButton = hasAlternative
            ? `<button type="button" class="alt-part-button" data-alt-part-toggle aria-pressed="false">${escapeHtml(t("alternativePart"))}</button>`
            : "";

        return `
            <div class="party-part">
                <span class="part-number">[${partNumber}]</span>
                <span class="party-name"${nameAttributes}>${escapeHtml(partName)}</span>
                ${alternativeButton}
            </div>
        `;
    }).join("");

    return `
        <div class="info-block is-full">
            ${labelWithHelp(t("party"), "parts")}
            <div class="party-list">${items}</div>
        </div>
    `;
}

function initAlternativePartToggles(card) {
    card.querySelectorAll("[data-alt-part-toggle]").forEach(button => {
        const part = button.closest(".party-part");
        const name = part?.querySelector("[data-main-part][data-alt-part]");
        if (!name) {
            return;
        }

        button.addEventListener("click", () => {
            const isAlternative = button.getAttribute("aria-pressed") !== "true";
            button.setAttribute("aria-pressed", String(isAlternative));
            button.classList.toggle("is-active", isAlternative);
            name.classList.toggle("is-alternative", isAlternative);
            name.textContent = isAlternative ? name.dataset.altPart : name.dataset.mainPart;
        });
    });
}

function isAlternativePart(part) {
    return Array.isArray(part) && part.length > 1;
}

function mainPartName(part) {
    return Array.isArray(part) ? part[0] : part;
}

function alternativePartName(part) {
    return Array.isArray(part) ? part[1] : "";
}

function displayPartName(part, useAlternative = false) {
    const name = useAlternative ? alternativePartName(part) : mainPartName(part);
    return isAccompanimentPart(name) ? displayAccompanimentPart(name) : String(name || "");
}

function displayAccompanimentPart(part) {
    return String(part || "")
        .replace(/\s*\(accomp\.\)\s*/i, " ")
        .trim();
}

function mapBlock(id, title) {
    if (!id) {
        return "";
    }

    const src = `maps/${encodeURIComponent(id)}.svg`;
    return `
        <div class="info-block is-full map-block is-pending" data-map-block>
            ${labelWithHelp(t("map"), "map")}
            <div class="map-scroll">
                <img class="map-image" src="${escapeAttribute(src)}" alt="${escapeAttribute(`${t("map")}: ${title}`)}">
            </div>
        </div>
    `;
}

function initMapBlock(card) {
    const block = card.querySelector("[data-map-block]");
    const image = block?.querySelector(".map-image");
    if (!block || !image) {
        return;
    }

    image.addEventListener("load", () => {
        block.classList.remove("is-pending");
    }, { once: true });

    image.addEventListener("error", () => {
        block.remove();
    }, { once: true });

    if (image.complete) {
        if (image.naturalWidth === 0) {
            block.remove();
            return;
        }
        block.classList.remove("is-pending");
    }
}

function commentBlock(comment) {
    const text = formatComment(comment);
    if (!text) {
        return "";
    }

    return `
        <div class="info-block is-full">
            ${labelWithHelp(t("comment"), "comment")}
            <p class="info-value comment-text">${escapeHtml(text)}</p>
        </div>
    `;
}

function labelWithHelp(label, descriptionKey, descriptionSubKey = "") {
    const description = descriptionText(descriptionKey, descriptionSubKey);
    if (!description) {
        return `<p class="info-label">${escapeHtml(label)}</p>`;
    }

    return `
        <p class="info-label">
            <span>${escapeHtml(label)}</span>
            <span class="help-tip" tabindex="0" aria-label="${escapeAttribute(description)}">
                <span class="help-icon" aria-hidden="true">?</span>
                <span class="help-bubble" role="tooltip">${escapeHtml(description)}</span>
            </span>
        </p>
    `;
}

function descriptionText(key, subKey = "") {
    const item = state.descriptions[key];
    if (!item) {
        return "";
    }

    const content = item[state.lang] ?? item.ja ?? item.en;
    return formatDescriptionContent(content, subKey);
}

function formatDescriptionContent(content, subKey = "") {
    if (content === null || content === undefined || content === "") {
        return "";
    }
    if (typeof content === "string" || typeof content === "number") {
        return String(content);
    }
    if (typeof content === "object") {
        const lines = [];
        if (content.common) {
            lines.push(content.common);
        }
        if (subKey && content[subKey]) {
            lines.push(content[subKey]);
        }
        return lines.join("\n");
    }
    return "";
}

function formatComment(comment) {
    if (comment === null || comment === undefined || comment === "") {
        return "";
    }
    if (typeof comment === "string" || typeof comment === "number") {
        return String(comment);
    }
    if (Array.isArray(comment)) {
        return comment.filter(Boolean).join("\n");
    }
    if (typeof comment === "object") {
        return comment[state.lang] || comment.ja || comment.en || "";
    }
    return "";
}

function formatHeading(song, lang = state.lang) {
    const formCode = song.id?.form || "";
    const matchedNameSource = headingNameSource(song);
    const formName = matchedNameSource ? headingNameSourceLabel(matchedNameSource, lang) : state.formNames[lang]?.[formCode] || formCode;
    const title = song.title?.[lang] || song.title?.en || song.title?.ja || "";
    const count = effectivePartyCount(song);

    if (lang === "ja") {
        const size = count === 1 ? "独奏" : `${count}重奏`;
        return `${formName}${size}「${title}」`;
    }

    const size = ensembleNamesEn[count] || `${count}-part Ensemble`;
    return `${formName} ${size} - "${title}"`;
}

function headingNameSource(song) {
    const instrumentInfos = countedPartyParts(song)
        .flatMap(part => instrumentNamesFromPart(part))
        .map(inst => state.instrumentCategoryByName[inst]);

    if (!instrumentInfos.length || instrumentInfos.some(info => !info)) {
        return null;
    }

    const firstInstrument = instrumentInfos[0];
    if (instrumentInfos.every(info => info.instrumentName === firstInstrument.instrumentName)) {
        return { type: "instrument", info: firstInstrument };
    }

    return deepestCommonNameableGroup(instrumentInfos);
}

function headingNameSourceLabel(source, lang = state.lang) {
    if (source.type === "instrument") {
        return lang === "ja" ? source.info.instrumentNameJa : source.info.instrumentName;
    }
    return lang === "ja" ? source.info.name : source.info.key;
}

function deepestCommonNameableGroup(instrumentInfos) {
    const firstPath = instrumentInfos[0].path || [];
    for (let index = firstPath.length - 1; index >= 0; index -= 1) {
        const candidate = firstPath[index];
        if (!candidate.canname) {
            continue;
        }
        const shared = instrumentInfos.every(info => {
            const node = info.path?.[index];
            return node && node.key === candidate.key;
        });
        if (shared) {
            return { type: "category", info: candidate };
        }
    }
    return null;
}

function instrumentNamesFromPart(part) {
    return String(mainPartName(part) || "")
        .split(/[,/]/)
        .map(name => normalizeInstrumentName(name))
        .filter(Boolean);
}

function normalizeInstrumentName(name) {
    return String(name || "")
        .replace(/\([^)]*\)/g, "")
        .replace(/\s+\d+$/g, "")
        .trim();
}

function effectivePartyCount(song) {
    const counted = countedPartyParts(song).length;
    return counted || (song.party || []).length;
}

function countedPartyParts(song) {
    return (song.party || []).filter(part => !isAccompanimentPart(part));
}

function isAccompanimentPart(part) {
    return /\(accomp\.\)/i.test(String(mainPartName(part) || ""));
}

function formatSongId(song) {
    const id = song.id || {};
    const base = `${id.form || ""}${String(id.number ?? "").padStart(4, "0")}`;
    return id.mov === null || id.mov === undefined ? base : `${base}-${id.mov}`;
}

function formatDuration(seconds) {
    const total = Number(seconds) || 0;
    const minutes = Math.floor(total / 60);
    const secs = String(total % 60).padStart(2, "0");
    return state.lang === "ja" ? `${minutes}分${secs}秒` : `${minutes}:${secs}`;
}

function difficultyLetter(value) {
    const number = Number(value);
    if (!Number.isFinite(number) || number < 1 || number > 7) {
        return "";
    }
    return String.fromCharCode(64 + number);
}

function formatPrice(price) {
    if (price === null || price === undefined || price === "") {
        return t("notOnSale");
    }
    return `￥${price}`;
}

function t(key, ...args) {
    const value = texts[state.lang][key] ?? texts.ja[key] ?? "";
    return typeof value === "function" ? value(...args) : value;
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
    return escapeHtml(value).replace(/`/g, "&#096;");
}
</script>
</body>
